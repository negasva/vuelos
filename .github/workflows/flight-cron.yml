name: Flight Price Tracker Cron

on:
  schedule:
    - cron: "0 8 * * *"
    - cron: "0 14 * * *"
    - cron: "0 21 * * *"
    - cron: "0 2 * * *"
    - cron: "0 11 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  ping-cron-endpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate cron configuration
        env:
          APP_URL: ${{ vars.APP_URL || secrets.APP_URL }}
        run: |
          if [ -z "${APP_URL}" ]; then
            echo "APP_URL is not configured. Set it as a repository variable or secret to your public deployment URL."
            exit 1
          fi

      - name: Call Vercel cron endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || secrets.APP_URL }}
        run: |
          if [ -z "${CRON_SECRET}" ]; then
            echo "CRON_SECRET is not configured."
            exit 1
          fi

          # Capture body + HTTP status so failures show the real cause in the log.
          http_code=$(curl -sS \
            -o response.txt \
            -w "%{http_code}" \
            -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/track-prices")

          echo "HTTP status: ${http_code}"
          echo "Response body:"
          cat response.txt || true
          echo

          if [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
            echo "Cron endpoint returned a non-success status."
            exit 1
          fi

