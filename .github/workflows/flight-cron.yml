name: Flight Price Tracker Cron

on:
  schedule:
    - cron: "0 8 * * *"
    - cron: "0 14 * * *"
    - cron: "0 21 * * *"
    - cron: "0 2 * * *"
    - cron: "0 11 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  track-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install "flights==0.9.0" requests

      - name: Track prices and send alerts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_DEFAULT_CHAT_ID: ${{ vars.TELEGRAM_DEFAULT_CHAT_ID || secrets.TELEGRAM_DEFAULT_CHAT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ vars.RESEND_FROM || secrets.RESEND_FROM }}
          ALERT_EMAIL_TO: ${{ vars.ALERT_EMAIL_TO || secrets.ALERT_EMAIL_TO }}
        run: python scripts/track_prices.py
